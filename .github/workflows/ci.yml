name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ─── Backend Tests ──────────────────────────────────────────────────────────
  backend-tests:
    name: Backend — Jest (Node 20)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: subscriptions_test
          POSTGRES_USER: admin
          POSTGRES_PASSWORD: secret
        ports:
          - '5432:5432'
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Run Jest test suite
        working-directory: backend
        env:
          DATABASE_URL: postgres://admin:secret@localhost:5432/subscriptions_test
          JWT_SECRET: ci_test_jwt_secret_must_be_at_least_32_chars
          JWT_REFRESH_SECRET: ci_test_refresh_secret_must_be_32_chars_long
          JWT_RESET_SECRET: ci_test_reset_secret_must_be_at_least_32_chars
          NODE_ENV: test
        run: npm test

  # ─── Frontend Tests ─────────────────────────────────────────────────────────
  frontend-tests:
    name: Frontend — Vitest (Node 20)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Run Vitest suite
        working-directory: frontend
        run: npm test
