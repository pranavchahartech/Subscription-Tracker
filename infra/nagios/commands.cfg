# Nagios Core command definitions for SubSpace monitoring.
# Prefixed with subspace/check_subspace to avoid colliding with Ubuntu nagios4 default commands.

# Run an NRPE check on a remote host (app-host port 5666)
define command {
    command_name    check_subspace_nrpe
    command_line    $USER1$/check_nrpe -H $HOSTADDRESS$ -c $ARG1$
}

# Check HTTP availability on port 80
define command {
    command_name    check_subspace_http
    command_line    $USER1$/check_http -H $HOSTADDRESS$ -p 80
}

# Check a specific HTTP path (e.g. /health) on port 80
define command {
    command_name    check_subspace_http_url
    command_line    $USER1$/check_http -H $HOSTADDRESS$ -p 80 -u $ARG1$
}

# Host email notification command (requires a local MTA/SMTP relay if email delivery is enabled)
define command {
    command_name    subspace-notify-host-by-email
    command_line    /usr/bin/printf "%b" "***** Nagios *****\n\nNotification Type: $NOTIFICATIONTYPE$\nHost: $HOSTNAME$\nState: $HOSTSTATE$\nAddress: $HOSTADDRESS$\nInfo: $HOSTOUTPUT$\n\nDate/Time: $LONGDATETIME$\n" | /usr/bin/mail -s "** $NOTIFICATIONTYPE$ Host Alert: $HOSTNAME$ is $HOSTSTATE$ **" $CONTACTEMAIL$
}

# Service email notification command (requires a local MTA/SMTP relay if email delivery is enabled)
define command {
    command_name    subspace-notify-service-by-email
    command_line    /usr/bin/printf "%b" "***** Nagios *****\n\nNotification Type: $NOTIFICATIONTYPE$\n\nService: $SERVICEDESC$\nHost: $HOSTALIAS$\nAddress: $HOSTADDRESS$\nState: $HOSTSTATE$\n\nDate/Time: $LONGDATETIME$\n\nAdditional Info:\n\n$SERVICEOUTPUT$\n" | /usr/bin/mail -s "** $NOTIFICATIONTYPE$ Service Alert: $HOSTALIAS$/$SERVICEDESC$ is $SERVICESTATE$ **" $CONTACTEMAIL$
}
