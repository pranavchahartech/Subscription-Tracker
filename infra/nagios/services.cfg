# Nagios Core service checks for SubSpace app-host and ops-host.
# Direct HTTP checks poll port 80; host & container checks execute via NRPE (port 5666).

# ── app-host Direct HTTP Checks ──────────────────────────────────────────────

define service {
    use                     generic-service
    host_name               app-host
    service_description     HTTP Frontend (Port 80)
    check_command           check_subspace_http
    check_interval          1
    retry_interval          1
    max_check_attempts      3
    contact_groups          subspace-admins
}

define service {
    use                     generic-service
    host_name               app-host
    service_description     Backend Health (/health)
    check_command           check_subspace_http_url!/health
    check_interval          1
    retry_interval          1
    max_check_attempts      3
    contact_groups          subspace-admins
}

