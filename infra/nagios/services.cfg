# ── ops-host Self-Monitoring Checks ──────────────────────────────────────────

define service {
    use                     generic-service
    host_name               ops-host
    service_description     Ops Host CPU Load
    check_command           check_local_load!5.0,4.0,3.0!10.0,8.0,6.0
    check_interval          2
    contact_groups          subspace-admins
}

define service {
    use                     generic-service
    host_name               ops-host
    service_description     Ops Host Root Disk
    check_command           check_local_disk!20%!10%!/
    check_interval          2
    contact_groups          subspace-admins
}
