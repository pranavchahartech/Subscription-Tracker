# Nagios Core contact and notification settings for SubSpace.
# Email notifications use local mail if configured (SMTP optional for lab demo; alerts always appear in Nagios UI).

define contact {
    contact_name                    subspace-admin
    use                             generic-contact
    alias                           SubSpace DevOps Admin
    email                           devops-alerts@example.com
    host_notification_period        24x7
    service_notification_period     24x7
    host_notification_options       d,u,r
    service_notification_options    w,u,c,r
    host_notification_commands      subspace-notify-host-by-email
    service_notification_commands   subspace-notify-service-by-email
}

define contactgroup {
    contactgroup_name   subspace-admins
    alias               SubSpace Operations Team
    members             subspace-admin
}
