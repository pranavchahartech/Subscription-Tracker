# Nagios Core monitored host definitions.
# Hostnames resolve to private VPC IPs via /etc/hosts (configured by Ansible common role).

define host {
    use                     linux-server
    host_name               app-host
    alias                   SubSpace Application Host
    address                 app-host
    max_check_attempts      3
    check_interval          1
    retry_interval          1
    check_period            24x7
    contact_groups          subspace-admins
}

define host {
    use                     linux-server
    host_name               ops-host
    alias                   SubSpace Operations Host (Puppet + Nagios)
    address                 127.0.0.1
    max_check_attempts      3
    check_interval          1
    retry_interval          1
    check_period            24x7
    contact_groups          subspace-admins
}
